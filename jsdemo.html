<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>The Test Scores App</h1>
<script src="test_scores.js"></script>
<h1>The Miles Per Gallon Calculator</h1>
<script>
const miles = parseInt(prompt("Enter miles driven"));
const gallons = parseInt(prompt("Enter gallons of gas used"));
const mpg = parseFloat(miles/gallons);
const html2 = `<p>Miles: ${miles}</p>
<p>Gallons: ${gallons}</p>
<p>MPG: ${mpg.toFixed(2)}</p>`;
document.write(html2);
</script>
<h2>The Rectangle Area Calculator</h2>
<script>
    const width = parseInt(prompt("Enter the width of the rectangle"));
    const height = parseInt(prompt("Enter the height of the recatngle"));
    const area = parseFloat(width*height).tofixed(3);

    const html3 = `<p>Width: ${width}</p>
                    <p>Height: ${height}</p>
                    <p>Area: ${area}</p>`;
document.write(html3);
</script>
</body>
</html>
